[package]
name = "nexus-app"
description = "Leptos frontend for Nexus CMS"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
leptos_router = "0.7"
leptos_meta = "0.7"
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
gloo-net = { version = "0.6", features = ["json"] }
gloo-storage = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlInputElement",
    "HtmlSelectElement", "HtmlTextAreaElement", "Event", "KeyboardEvent",
    "MouseEvent", "InputEvent", "FocusEvent", "DragEvent", "FileList",
    "File", "FormData", "Headers", "Request", "RequestInit", "Response",
    "Storage", "Location", "History", "Url", "console",
] }
js-sys = "0.3"
urlencoding.workspace = true
